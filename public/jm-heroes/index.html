<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>JM Hero Tuner</title>
<link rel="stylesheet" href="https://apex.resonateai.online/doc-hero.css">
<script src="https://apex.resonateai.online/doc-hero.js"></script>
<style>
  :root { --bg:#f5f2ec; --card:#fff; --ink:#1f1d1a; --muted:#6b6660; --line:#e4ddd0; --gold:#C9A43A; --ok:#2f6b3f; --no:#9b3b30; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 18px; margin: 4px 0 2px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .label { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .laptop { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); }
  .phone { width: 390px; max-width: 100%; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); }
  .brand-pill { color: #fff; }
  /* doc-hero.css switches to phone tiles by viewport width; copy those rules here so the 390px box matches a real phone */
  .phone .hero-band.doc-screen .client-logo-tile { width: 180px; min-width: 180px; height: 74px; padding: 6px 12px; }
  .phone .hero-band.doc-screen .client-logo-tile img { max-height: 54px; max-width: 150px; }
  .phone .hero-band.doc-screen .brand-pill { font-size: 13px; padding: 4px 12px; }
  .client-logo-tile img { border-radius: 4px; }
  .bar { position: sticky; top: 0; z-index: 50; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
  button { font: inherit; font-size: 14px; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  button.keep.on { background: var(--ok); border-color: var(--ok); }
  button.skip.on { background: var(--no); border-color: var(--no); }
  .count { font-weight: 700; min-width: 64px; text-align: center; }
  .vals { color: var(--muted); font-size: 13px; margin-left: auto; }
  .grp { display: flex; gap: 6px; align-items: center; padding-right: 8px; border-right: 1px solid var(--line); }
  .grp:last-of-type { border-right: 0; }
  .strip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
  .thumb { width: 96px; height: 54px; border-radius: 6px; overflow: hidden; border: 2px solid transparent; cursor: pointer; position: relative; padding: 0; }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb.cur { border-color: var(--gold); }
  .thumb .dot { position: absolute; top: 3px; right: 3px; width: 10px; height: 10px; border-radius: 50%; border: 1px solid #fff; }
  .thumb .dot.keep { background: var(--ok); } .thumb .dot.skip { background: var(--no); }
  .note { font-size: 13px; color: var(--muted); margin-top: 10px; }
  @media (max-width: 700px) { .vals { margin-left: 0; width: 100%; } .grp { border-right: 0; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>JM Luxury Pools: header photos</h1>
  <div class="sub">Frame each photo, pick dark or light tiles, then Keep or Skip. Everything saves on its own as you go.</div>

  <div class="bar">
    <div class="grp"><button id="prev">&lsaquo; Prev</button><span class="count" id="count">1 / 1</span><button id="next">Next &rsaquo;</button></div>
    <div class="grp"><button id="up">Up</button><button id="down">Down</button><button id="left">Left</button><button id="right">Right</button></div>
    <div class="grp"><button id="zin">Zoom in</button><button id="zout">Zoom out</button><button id="reset">Reset</button></div>
    <div class="grp"><button id="dark">Dark tiles</button><button id="light">Light tiles</button></div>
    <div class="grp"><button id="keep" class="keep">Keep</button><button id="skip" class="skip">Skip</button></div>
    <div class="vals" id="vals"></div>
  </div>

  <div class="label">Laptop</div>
  <div class="laptop">
    <div class="hero-band doc-screen" id="bandL">
      <img class="hero-img" id="imgL" alt="">
      <div class="header-tile-row"><div class="client-logo-tile"><img src="jm-logo.jpg" alt=""></div><span class="brand-pill">JM Luxury Pools</span></div>
    </div>
  </div>

  <div class="label">Phone</div>
  <div class="phone">
    <div class="hero-band doc-screen" id="bandP">
      <img class="hero-img" id="imgP" alt="">
      <div class="header-tile-row"><div class="client-logo-tile"><img src="jm-logo.jpg" alt=""></div><span class="brand-pill">JM Luxury Pools</span></div>
    </div>
  </div>
  <div class="note">The phone preview uses the phone-size tiles, the same as a customer sees on an iPhone.</div>

  <div class="label">All photos</div>
  <div class="strip" id="strip"></div>
</div>

<script>
var KEY = "jmHeroTuner.v1";
var photos = [], state = {}, cur = 0;
function load() { try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; } try { cur = Number(localStorage.getItem(KEY + ".cur")) || 0; } catch (e) {} }
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); localStorage.setItem(KEY + ".cur", String(cur)); } catch (e) {} }
function get(k) { if (!state[k]) state[k] = { focus_x: 50, focus_y: 50, zoom: 100, tone: "dark", status: "" }; return state[k]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function render() {
  var p = photos[cur]; if (!p) return;
  var s = get(p.key);
  ["L", "P"].forEach(function (x) {
    var img = document.getElementById("img" + x);
    if (img.getAttribute("src") !== p.file) img.src = p.file;
    docHeroApply(document.getElementById("band" + x), img, s);
  });
  document.getElementById("count").textContent = (cur + 1) + " / " + photos.length;
  document.getElementById("vals").textContent = p.key + " · " + p.source + " · focus " + s.focus_x + "/" + s.focus_y + " · zoom " + s.zoom + "%";
  document.getElementById("dark").classList.toggle("on", s.tone !== "light");
  document.getElementById("light").classList.toggle("on", s.tone === "light");
  document.getElementById("keep").classList.toggle("on", s.status === "keep");
  document.getElementById("skip").classList.toggle("on", s.status === "skip");
  var strip = document.getElementById("strip");
  [].forEach.call(strip.children, function (b, i) {
    b.classList.toggle("cur", i === cur);
    var st = (state[photos[i].key] || {}).status || "";
    b.querySelector(".dot").className = "dot " + st;
    b.querySelector(".dot").style.display = st ? "" : "none";
  });
  save();
}
function nudge(dx, dy) { var s = get(photos[cur].key); s.focus_x = clamp(s.focus_x + dx, 0, 100); s.focus_y = clamp(s.focus_y + dy, 0, 100); render(); }
function go(i) { cur = (i + photos.length) % photos.length; render(); }

document.getElementById("prev").onclick = function () { go(cur - 1); };
document.getElementById("next").onclick = function () { go(cur + 1); };
// Up shows more of the upper part of the photo: lower the Y focus.
document.getElementById("up").onclick = function () { nudge(0, -5); };
document.getElementById("down").onclick = function () { nudge(0, 5); };
document.getElementById("left").onclick = function () { nudge(-5, 0); };
document.getElementById("right").onclick = function () { nudge(5, 0); };
document.getElementById("zin").onclick = function () { var s = get(photos[cur].key); s.zoom = clamp(s.zoom + 10, 100, 200); render(); };
document.getElementById("zout").onclick = function () { var s = get(photos[cur].key); s.zoom = clamp(s.zoom - 10, 100, 200); render(); };
document.getElementById("reset").onclick = function () { var s = get(photos[cur].key); s.focus_x = 50; s.focus_y = 50; s.zoom = 100; render(); };
document.getElementById("dark").onclick = function () { get(photos[cur].key).tone = "dark"; render(); };
document.getElementById("light").onclick = function () { get(photos[cur].key).tone = "light"; render(); };
document.getElementById("keep").onclick = function () { var s = get(photos[cur].key); s.status = s.status === "keep" ? "" : "keep"; render(); };
document.getElementById("skip").onclick = function () { var s = get(photos[cur].key); s.status = s.status === "skip" ? "" : "skip"; render(); };
document.addEventListener("keydown", function (e) {
  if (e.key === "ArrowRight") go(cur + 1); else if (e.key === "ArrowLeft") go(cur - 1);
});

load();
fetch("photos.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (list) {
  photos = list;
  var strip = document.getElementById("strip");
  photos.forEach(function (p, i) {
    var b = document.createElement("button"); b.className = "thumb"; b.title = p.key;
    b.innerHTML = '<img loading="lazy" alt="" src="' + p.file + '"><span class="dot"></span>';
    b.onclick = function () { go(i); };
    strip.appendChild(b);
  });
  if (cur >= photos.length) cur = 0;
  render();
});
</script>
</body>
</html>
